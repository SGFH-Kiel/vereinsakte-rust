<!doctype html>
<html lang="de">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} – Vereinsakte</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>

    </div>
  </main>

</html>
