{% extends "base.html" %}
{% block content %}
<div class="page-head">
  <div><h1>Mitglieder</h1>
  <p class="muted">Aktive Mitglieder der Segelgruppe</p></div>
  {% if v.can_manage %}<div class="actions"><a class="btn primary" href="/mitglieder/neu">Mitglied aufnehmen</a></div>{% endif %}
</div>
<form method="get" action="/mitglieder" class="filters">
  <div class="field">
    <label for="f-q">Name suchen</label>
    <input id="f-q" type="search" name="q" value="{{ v.query }}" autocomplete="off"
           hx-get="/mitglieder" hx-trigger="input changed delay:300ms, search" hx-include="[name='art'],[name='schein']"
           hx-target="#mitglieder-tabelle" hx-swap="outerHTML">
  </div>
  <div class="field">
    <label for="f-art">Mitgliedsart</label>
    <select id="f-art" name="art">
      <option value="">alle</option>
      {% for (key, label) in types %}<option value="{{ key }}"{% if *key == v.membership_type.as_str() %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </div>
  <div class="field">
    <label for="f-schein">Segelschein</label>
    <input id="f-schein" type="text" name="schein" value="{{ v.license }}" placeholder="z. B. SKS">
  </div>
  <button type="submit" class="primary">Filtern</button>
</form>
{% include "directory_table.html" %}
{% endblock %}
